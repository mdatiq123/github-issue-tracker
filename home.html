<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <link rel="shortcut icon" href="./assets/git-hub-issue.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#F8FAFC] pb-14">
    <header>
        <nav>
            <div class="navbar bg-white shadow-sm border-b border-base-300 px-4 md:px-20 py-4 flex flex-col md:flex-row gap-4 md:gap-0">
                <div class="flex-1">
                    <div class="flex flex-row items-center space-x-1">
                        <img class="w-9 h-9" src="./assets/github-logo.png" alt="Logo">
                        <h1 class="font-semibold text-lg md:text-2xl text-neutral">GitHub Issues Tracker</h1>
                    </div>
                </div>
                <div class="flex gap-2 w-full md:w-auto">
                    <label class="input input-bordered flex items-center gap-2 flex-1 md:w-[300px]">
                        <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
                        <input id="search-input" type="text" class="grow outline-none" placeholder="Search issues..." />
                    </label>
                    <button id="search-btn" class="btn btn-primary text-sm md:text-xl font-bold">+ New</button>
                </div>
            </div>
        </nav>
    </header>

    <section>
        <div class="filter-buttons bg-white w-11/12 md:w-10/12 mx-auto mt-8 md:mt-12 p-4 md:p-6 shadow-md rounded-md flex flex-wrap gap-2 justify-center md:justify-start">
            <button id="all-btn" class="btn btn-primary w-[80px] md:w-[120px]">All</button>
            <button id="open-btn" class="btn btn-primary btn-outline w-[80px] md:w-[120px]">Open</button>
            <button id="close-btn" class="btn btn-primary btn-outline w-[80px] md:w-[120px]">Closed</button>
        </div>
    </section>

    <section class="w-11/12 md:w-10/12 mx-auto mb-12 shadow-sm rounded-md overflow-hidden">
        <div class="mt-4 bg-white shadow-sm border-b border-base-300 px-4 md:px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex gap-3 items-center">
                <div class="p-2 rounded-full bg-[#ECE4FF] flex justify-center items-center">
                    <img src="./assets/Aperture.png" alt="Icon">
                </div>
                <div>
                    <h2 class="font-semibold text-xl text-neutral"><span id="issues-Counter">0</span> Issues</h2>
                    <p class="text-[#64748B] font-normal text-sm">Track and manage your project issues</p>
                </div>
            </div>
            <div class="flex gap-4">
                <div class="text-xs text-neutral font-bold flex items-center">
                    <span class="bg-[#00A96E] rounded-full w-3 h-3 mr-1 inline-block"></span> Open
                </div>
                <div class="text-xs text-neutral font-bold flex items-center">
                    <span class="bg-[#A855F7] rounded-full w-3 h-3 mr-1 inline-block"></span> Closed
                </div>
            </div>
        </div>
        
        <hr class="border-gray-100">

        <section id="spinner" class="mt-12 flex justify-center items-center hidden">
            <span class="loading loading-bars loading-xl"></span>
        </section>

        <div id="card-Container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 bg-white py-8 px-4 md:px-7 mb-4 rounded-b-md">
            </div>
    </section>

    <dialog id="my_modal" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box p-0 overflow-hidden">
            <div id="modalContainer"></div>
            <div class="modal-action p-4 border-t border-gray-50">
                <form method="dialog">
                    <button class="btn btn-primary w-full sm:w-auto">Close</button>
                </form>
            </div>
        </div>
    </dialog>

    <script src="./script/home.js"></script>
</body>

</html>
